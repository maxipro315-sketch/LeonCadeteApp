<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Despacho | Cadetería El León</title>
    
    <meta name="theme-color" content="#d4af37">
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="icon" type="image/png" href="icon-192.png?v=2">
    <link rel="apple-touch-icon" href="icon-180.png?v=2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="El León">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root { 
            --dorado: #d4af37; --rojo: #D32F2F; --azul: #1976D2; --verde: #25D366; 
            --negro-puro: #050505; --negro-card: #121212; --blanco: #ffffff; 
            --borde-glow: rgba(212, 175, 55, 0.3);
        }
        
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { 
            background-color: var(--negro-puro); color: var(--blanco); font-family: 'Poppins', sans-serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; 
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            min-height: 100vh;
        }

        @keyframes slideInUp { 0% { opacity: 0; transform: translateY(40px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pulseRadar { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        .header { 
            background: rgba(18, 18, 18, 0.8); width: 100%; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border-bottom: 2px solid var(--borde-glow); position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header-title { font-family: 'Bebas Neue', cursive; font-size: 2.2rem; color: var(--blanco); margin: 0; letter-spacing: 2px;}
        .header-title span { color: var(--dorado); }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%; padding: 20px; animation: slideInUp 0.6s ease-out forwards; }
        #admin-screen { display: none; flex-direction: column; width: 100%; max-width: 600px; padding: 20px; animation: slideInUp 0.6s ease-out forwards; }

        .card { 
            background: linear-gradient(145deg, rgba(20,20,20,0.9), rgba(10,10,10,0.9)); 
            border: 1px solid rgba(212, 175, 55, 0.15); border-radius: 24px; padding: 30px; 
            width: 100%; text-align: center; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }

        .form-card { border: 2px solid var(--borde-glow); position: relative; overflow: hidden; margin-top: 15px;}
        .card-header-glow { font-family: 'Bebas Neue', cursive; font-size: 1.8rem; color: var(--dorado); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 25px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        
        .input-wrapper { position: relative; margin-bottom: 15px; }
        .input-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--dorado); font-size: 1.2rem; z-index: 2; }
        .input-field-modern {
            width: 100%; background: #050505; border: 1px solid #333; color: white; padding: 16px 16px 16px 50px; 
            border-radius: 16px; font-family: 'Poppins', sans-serif; font-size: 1rem; outline: none; transition: all 0.3s;
        }
        .input-field-modern:focus { border-color: var(--dorado); background: #0a0a0a; box-shadow: 0 0 15px rgba(212,175,55,0.2); }
        
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-family: 'Bebas Neue', cursive; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: 1px; }
        .btn-login { background: linear-gradient(45deg, var(--dorado), #b8962e); color: black; font-weight: bold; }
        .btn-lanzar-modern { background: linear-gradient(45deg, #333, #222); color: var(--dorado); border: 1px solid var(--dorado); margin-top: 10px; }
        .btn-mapa { background: #1a1a1a; color: var(--dorado); border: 2px solid var(--dorado); margin-bottom: 25px; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2); }
        .btn-mapa:hover { background: var(--dorado); color: black; }
        
        .section-title { font-family: 'Bebas Neue', cursive; font-size: 1.8rem; color: var(--blanco); margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        
        .flota-pill { padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .flota-libre { background: rgba(37,211,102,0.15); border: 1px solid var(--verde); color: var(--verde); }
        .flota-viaje { background: rgba(211,47,47,0.15); border: 1px solid var(--rojo); color: var(--rojo); }

        .btn-borrar-cadete { cursor: pointer; opacity: 0.6; font-size: 1.1rem; transition: opacity 0.2s; }
        .btn-borrar-cadete:hover { opacity: 1; color: #fff; }
        .btn-borrar-viaje { background: transparent; border: none; color: var(--rojo); font-size: 1.4rem; cursor: pointer; padding: 5px; opacity: 0.8; transition: opacity 0.2s;}
        .btn-borrar-viaje:hover { opacity: 1; transform: scale(1.1); }
        
        .btn-bloquear-cliente { background: transparent; border: none; color: #ff5722; font-size: 1.3rem; cursor: pointer; padding: 5px; opacity: 0.8; }
        .btn-bloquear-cliente:hover { opacity: 1; transform: scale(1.1); }

        .btn-aprobar { background: var(--verde); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-family: 'Poppins'; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px;}

        .pedido-item { background: #111; border: 1px solid #333; border-radius: 16px; padding: 18px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; border-left: 6px solid var(--dorado); }
        .pedido-item.solicitado { border-left-color: var(--dorado); background: rgba(212,175,55,0.05); }
        .pedido-item.asignado { border-left-color: var(--verde); border-width: 2px; }
        .pedido-header { display: flex; justify-content: space-between; align-items: center; font-family: 'Bebas Neue', cursive; font-size: 1.5rem; }
        .pedido-zona { font-size: 0.95rem; color: #ccc; text-align: left; line-height: 1.6; }
        .estado-badge { font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; font-family: 'Poppins'; font-weight: bold; display: flex; align-items: center; gap: 6px;}
        .badge-esperando { background: rgba(212,175,55,0.15); color: var(--dorado); border: 1px solid rgba(212,175,55,0.3); }
        .badge-aceptado { background: rgba(37,211,102,0.15); color: var(--verde); border: 1px solid rgba(37,211,102,0.3); }
        
        .info-cliente { background: #080808; padding: 10px; border-radius: 10px; font-size: 0.85rem; border: 1px solid #222; display: flex; justify-content: space-between; align-items: center;}

        .historial-resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .historial-stat { padding: 14px; background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.2); border-radius: 12px; text-align: left; }
        .historial-stat span { display: block; color: #999; font-size: 0.75rem; text-transform: uppercase; }
        .historial-stat strong { display: block; color: var(--dorado); font-family: 'Bebas Neue', cursive; font-size: 1.8rem; }
        .historial-label { display: block; color: var(--dorado); font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; text-align: left; }
        .historial-select { padding-left: 16px; margin-bottom: 18px; cursor: pointer; }
        .historial-grupo { padding: 16px 0; border-top: 1px solid #303030; text-align: left; }
        .historial-cadete { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
        .historial-cadete strong { color: var(--blanco); }
        .historial-cadete small { display: block; color: #888; margin-top: 3px; }
        .historial-cantidad { color: var(--dorado); font-size: 0.8rem; white-space: nowrap; }
        .historial-viaje { padding: 12px; margin: 8px 0 0 10px; border-left: 2px solid rgba(212,175,55,0.5); background: rgba(255,255,255,0.025); }
        .historial-viaje-cabecera { display: flex; justify-content: space-between; gap: 10px; color: var(--verde); font-weight: 600; font-size: 0.85rem; }
        .historial-viaje p { margin: 6px 0 0; color: #bbb; font-size: 0.82rem; line-height: 1.5; overflow-wrap: anywhere; }
        .historial-vacio { color: #888; padding: 16px 0; text-align: center; font-size: 0.9rem; }
        @media (max-width: 380px) { .historial-viaje-cabecera { flex-direction: column; gap: 2px; } }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--verde); color: white; font-weight: 600; padding: 14px 28px; border-radius: 30px; display: none; z-index: 4000; text-align: center; }

        #mapa-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 3000; flex-direction: column; padding: 15px; animation: slideInUp 0.3s ease; }
        #mapa-admin { flex: 1; width: 100%; border-radius: 16px; border: 2px solid var(--dorado); background: #222; }
        .leaflet-control-attribution { display: none !important; }
        .etiqueta-moto { background: rgba(0,0,0,0.8); color: var(--dorado); border: 1px solid var(--dorado); border-radius: 5px; font-weight: bold; font-family: 'Poppins'; font-size: 0.8rem; box-shadow: none; margin-top: -10px;}
        .etiqueta-moto::before { display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="card" style="max-width: 400px; padding: 40px 30px;">
            <div style="display: inline-block; padding: 20px; background: rgba(212,175,55,0.1); border-radius: 50%; margin-bottom: 20px;">
                <i class="fas fa-shield-alt" style="font-size: 3.5rem; color: var(--dorado); animation: pulseRadar 2s infinite; border-radius: 50%;"></i>
            </div>
            <h2 style="font-family: 'Bebas Neue'; font-size: 2.2rem; margin: 0 0 25px 0;">BASE EL LEÓN</h2>
            <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="admin-pass" class="input-field-modern" placeholder="Clave Maestra"></div>
            <button class="btn btn-login" onclick="validarAcceso()">ENTRAR A LA CENTRAL</button>
        </div>
    </div>

    <div id="admin-screen">
        <div class="header" style="border-radius: 20px; margin-bottom: 20px;">
            <h1 class="header-title">CADETERÍA <span>EL LEÓN</span></h1>
        </div>

        <h2 class="section-title"><i class="fas fa-motorcycle"></i> Flota Activa</h2>
        <div id="lista-flota" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
            <p style="color: #666; font-size: 0.95rem;"><i class="fas fa-spinner fa-spin"></i> Esperando cadetes...</p>
        </div>

        <button class="btn btn-mapa" onclick="abrirMapa()">
            <i class="fas fa-map-marked-alt"></i> VER MAPA DE FLOTA
        </button>

        <h2 class="section-title"><i class="fas fa-satellite"></i> Radar Central (En Vivo)</h2>
        <div id="lista-pedidos" style="margin-bottom: 25px;"></div>

        <div class="card form-card" style="padding: 30px 25px;">
            <div class="card-header-glow"><i class="fab fa-whatsapp"></i> INGRESO MANUAL</div>
            <div class="input-wrapper"><i class="fas fa-map-marker-alt" style="color: var(--rojo);"></i><input type="text" id="input-origen" class="input-field-modern" placeholder="¿Dónde retira el cadete?"></div>
            <div class="input-wrapper"><i class="fas fa-flag-checkered" style="color: var(--azul);"></i><input type="text" id="input-destino" class="input-field-modern" placeholder="¿Dónde entrega?"></div>
            <div class="input-wrapper"><i class="fas fa-box"></i><input type="text" id="input-detalle" class="input-field-modern" placeholder="¿Qué lleva? (Ej: Llaves)"></div>
            <button class="btn btn-lanzar-modern" id="btn-lanzar" onclick="lanzarPedidoManual()"><i class="fas fa-rocket"></i> ENVIAR AL RADAR</button>
        </div>

        <div class="card form-card" style="padding: 30px 25px;">
            <div class="card-header-glow"><i class="fas fa-user-plus"></i> ALTA DE REPARTIDOR</div>
            <div class="input-wrapper"><i class="fas fa-id-badge"></i><input type="text" id="nuevo-cadete-usuario" class="input-field-modern" placeholder="Usuario (apellido, sin espacios)" autocomplete="off"></div>
            <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="nuevo-cadete-nombre" class="input-field-modern" placeholder="Nombre completo" autocomplete="name"></div>
            <div class="input-wrapper"><i class="fas fa-motorcycle"></i><input type="text" id="nuevo-cadete-moto" class="input-field-modern" placeholder="Moto o vehículo" autocomplete="off"></div>
            <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="nuevo-cadete-clave" class="input-field-modern" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password"></div>
            <button class="btn btn-login" id="btn-crear-cadete" onclick="crearCadete()"><i class="fas fa-user-check"></i> CREAR USUARIO</button>
        </div>

        <section class="card" aria-labelledby="titulo-historial">
            <h2 class="section-title" id="titulo-historial"><i class="fas fa-clipboard-list"></i> Historial de cadetes</h2>
            <div class="historial-resumen">
                <div class="historial-stat"><span>Cadetes registrados</span><strong id="historial-total-cadetes">0</strong></div>
                <div class="historial-stat"><span>Viajes entregados</span><strong id="historial-total-viajes">0</strong></div>
            </div>
            <label class="historial-label" for="filtro-historial-cadete">Filtrar por cadete</label>
            <select id="filtro-historial-cadete" class="input-field-modern historial-select">
                <option value="" disabled selected>Seleccioná un cadete</option>
            </select>
            <div id="lista-historial-cadetes" aria-live="polite">
                <p class="historial-vacio">Cargando historial...</p>
            </div>
        </section>
    </div>

    <div id="mapa-modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px;">
            <h2 style="margin: 0; font-family: 'Bebas Neue'; font-size: 2rem; color: var(--dorado);"><i class="fas fa-satellite-dish"></i> RADAR DE FLOTA</h2>
            <button onclick="cerrarMapa()" style="background: transparent; border: none; color: white; font-size: 2.5rem; cursor: pointer; line-height: 1;">&times;</button>
        </div>
        <div id="mapa-admin"></div>
    </div>

    <div id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyCJxlyB2mP05kfMhL_AhZPTE_IHOvVxIH4", authDomain: "burger-piola-tracking.firebaseapp.com", databaseURL: "https://burger-piola-tracking-default-rtdb.firebaseio.com", projectId: "burger-piola-tracking", storageBucket: "burger-piola-tracking.firebasestorage.app", messagingSenderId: "399109949329", appId: "1:399109949329:web:3fd6dbeeaa4dc2a5773c30" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let historialEntregados = []; 
        let cadetesAutorizados = {};
        let viajesFinalizados = [];
        let mapaGlobal = null; 
        let marcadoresMotos = {}; 
        const LAT_LOCAL = -33.131058; const LNG_LOCAL = -64.340524; 

        const iconoMotoLibre = L.divIcon({ html: `<div style="background: var(--verde); color: black; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-size: 14px; box-shadow: 0 0 10px rgba(37,211,102,0.5);"><i class="fas fa-motorcycle"></i></div>`, className: '', iconSize: [30, 30] });
        const iconoMotoViaje = L.divIcon({ html: `<div style="background: var(--rojo); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--dorado); font-size: 14px; box-shadow: 0 0 10px rgba(211,47,47,0.5);"><i class="fas fa-motorcycle"></i></div>`, className: '', iconSize: [30, 30] });

        window.validarAcceso = function() {
            if (document.getElementById('admin-pass').value === "piola123") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-screen').style.display = 'flex';
                
                mapaGlobal = L.map('mapa-admin').setView([LAT_LOCAL, LNG_LOCAL], 14);
                
                // NUEVA CAPA SIMPLE Y SIN RESTRICCIONES (Esri World Street Map)
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19,
                    attribution: 'Tiles &copy; Esri'
                }).addTo(mapaGlobal);
                
                escucharPedidos(); escucharFlota(); escucharCadetesAutorizados();
            }
        };

        window.abrirMapa = function() {
            document.getElementById('mapa-modal').style.display = 'flex';
            if(mapaGlobal) { setTimeout(() => { mapaGlobal.invalidateSize(); }, 300); }
        };
        window.cerrarMapa = function() {
            document.getElementById('mapa-modal').style.display = 'none';
        };

        window.mostrarToast = function(mensaje, color) { const toast = document.getElementById('toast'); toast.innerHTML = mensaje; toast.style.background = color; toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 4000); }

        document.getElementById('filtro-historial-cadete').addEventListener('change', renderizarHistorialCadetes);

        function escucharCadetesAutorizados() {
            onValue(ref(db, 'cadetes_autorizados'), (snapshot) => {
                cadetesAutorizados = snapshot.exists() ? snapshot.val() : {};
                const selector = document.getElementById('filtro-historial-cadete');
                const seleccionado = selector.value;
                selector.replaceChildren(new Option('Seleccioná un cadete', ''));

                Object.entries(cadetesAutorizados)
                    .sort((a, b) => (a[1].nombre || a[0]).localeCompare(b[1].nombre || b[0], 'es'))
                    .forEach(([usuario, cadete]) => selector.add(new Option(`${cadete.nombre || usuario} (@${usuario})`, usuario)));

                if (seleccionado && cadetesAutorizados[seleccionado]) selector.value = seleccionado;
                renderizarHistorialCadetes();
            });
        }

        function renderizarHistorialCadetes() {
            const lista = document.getElementById('lista-historial-cadetes');
            const filtro = document.getElementById('filtro-historial-cadete').value;
            document.getElementById('historial-total-cadetes').textContent = String(Object.keys(cadetesAutorizados).length);
            lista.replaceChildren();

            if (!filtro) {
                document.getElementById('historial-total-viajes').textContent = '—';
                const mensaje = document.createElement('p');
                mensaje.className = 'historial-vacio';
                mensaje.textContent = Object.keys(cadetesAutorizados).length ? 'Seleccioná un cadete para ver sus viajes entregados.' : 'Todavía no hay cadetes registrados.';
                lista.append(mensaje);
                return;
            }

            const cadete = cadetesAutorizados[filtro] || {};
            const grupo = {
                usuario: filtro,
                nombre: cadete.nombre || filtro,
                moto: cadete.moto || '',
                viajes: viajesFinalizados.filter(viaje => (viaje.repartidor || '') === filtro)
            };
            document.getElementById('historial-total-viajes').textContent = String(grupo.viajes.length);

            [grupo].forEach(grupo => {
                const seccion = document.createElement('section');
                seccion.className = 'historial-grupo';
                const encabezado = document.createElement('div');
                encabezado.className = 'historial-cadete';
                const identidad = document.createElement('div');
                const nombre = document.createElement('strong');
                nombre.textContent = grupo.nombre;
                const usuario = document.createElement('small');
                usuario.textContent = `@${grupo.usuario}${grupo.moto ? ` · ${grupo.moto}` : ''}`;
                identidad.append(nombre, usuario);
                const cantidad = document.createElement('span');
                cantidad.className = 'historial-cantidad';
                cantidad.textContent = `${grupo.viajes.length} ${grupo.viajes.length === 1 ? 'viaje' : 'viajes'}`;
                encabezado.append(identidad, cantidad);
                seccion.append(encabezado);

                if (!grupo.viajes.length) {
                    const vacio = document.createElement('p');
                    vacio.className = 'historial-vacio';
                    vacio.textContent = 'Sin viajes entregados.';
                    seccion.append(vacio);
                }

                grupo.viajes.forEach(viaje => {
                    const tarjeta = document.createElement('article');
                    tarjeta.className = 'historial-viaje';
                    const cabecera = document.createElement('div');
                    cabecera.className = 'historial-viaje-cabecera';
                    const codigo = document.createElement('span');
                    codigo.textContent = viaje.codigo || 'Viaje';
                    const fecha = document.createElement('time');
                    const marcaTiempo = Number(viaje.timestamp);
                    fecha.dateTime = Number.isFinite(marcaTiempo) ? new Date(marcaTiempo).toISOString() : '';
                    fecha.textContent = Number.isFinite(marcaTiempo) ? new Intl.DateTimeFormat('es-AR', { dateStyle: 'medium', timeStyle: 'short' }).format(marcaTiempo) : 'Fecha no disponible';
                    cabecera.append(codigo, fecha);
                    const detalle = document.createElement('p');
                    const origen = viaje.origen || 'Punto de retiro';
                    const destino = viaje.destino || viaje.direccion || 'Destino no disponible';
                    const precio = Number.isFinite(Number(viaje.precio)) ? new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Number(viaje.precio)) : 'Sin precio';
                    detalle.textContent = `${origen} → ${destino} · ${viaje.detalle || 'Envío'} · ${precio}`;
                    tarjeta.append(cabecera, detalle);
                    seccion.append(tarjeta);
                });

                lista.append(seccion);
            });
        }

        window.crearCadete = async function() {
            const usuario = document.getElementById('nuevo-cadete-usuario').value.trim().toLowerCase();
            const nombre = document.getElementById('nuevo-cadete-nombre').value.trim();
            const moto = document.getElementById('nuevo-cadete-moto').value.trim();
            const clave = document.getElementById('nuevo-cadete-clave').value;
            const btn = document.getElementById('btn-crear-cadete');

            if (!/^[a-z0-9_-]{3,30}$/.test(usuario)) return alert("El usuario debe tener entre 3 y 30 caracteres: letras sin tilde, números, guion o guion bajo.");
            if (!nombre || !moto) return alert("Completá el nombre y el vehículo del repartidor.");
            if (clave.length < 6) return alert("La contraseña debe tener al menos 6 caracteres.");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CREANDO...';

            try {
                const cadeteRef = ref(db, 'cadetes_autorizados/' + usuario);
                const existente = await get(cadeteRef);
                if (existente.exists()) {
                    alert("Ese usuario ya está registrado. Elegí otro.");
                    return;
                }

                await set(cadeteRef, { nombre, moto, clave });
                document.getElementById('nuevo-cadete-usuario').value = '';
                document.getElementById('nuevo-cadete-nombre').value = '';
                document.getElementById('nuevo-cadete-moto').value = '';
                document.getElementById('nuevo-cadete-clave').value = '';
                mostrarToast("<i class='fas fa-check-circle'></i> Repartidor creado. Ya puede ingresar.", "var(--verde)");
            } catch (error) {
                console.error("Error creando repartidor:", error);
                alert("No se pudo crear el usuario. Verificá la conexión y los permisos de escritura de Firebase.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-check"></i> CREAR USUARIO';
            }
        };

        window.borrarPedido = async function(codigo, idCadete = null) { 
            if(confirm(`¿Estás seguro de cancelar y borrar el viaje ${codigo}?`)) { 
                await remove(ref(db, 'bolsa_pedidos/' + codigo)); 
                if (idCadete && idCadete !== "undefined" && idCadete !== "") {
                    await update(ref(db, 'repartidores/' + idCadete), { estado: "inactivo" });
                }
                mostrarToast("<i class='fas fa-trash'></i> Viaje cancelado.", "var(--rojo)"); 
            } 
        };

        window.bloquearCliente = async function(codigo, dni, ip) {
            if(!dni) return alert("Este pedido es manual y no tiene DNI de cliente registrado.");
            
            if(confirm(`¿Bloquear permanentemente al DNI ${dni} y cancelar este pedido fantasma?`)) {
                await set(ref(db, 'clientes_bloqueados/' + dni), {
                    bloqueadoEl: Date.now(),
                    motivo: "Pedido falso o fantasma",
                    ultimoCodigo: codigo,
                    ipRegistrada: ip || "Desconocida"
                });

                if (ip && ip !== "No detectada") {
                    const ipLimpia = ip.replace(/\./g, "_");
                    await set(ref(db, 'clientes_bloqueados/' + ipLimpia), {
                        bloqueadoEl: Date.now(),
                        motivo: "IP asociada a DNI bloqueado",
                        dniAsociado: dni
                    });
                }

                await remove(ref(db, 'bolsa_pedidos/' + codigo));
                mostrarToast("<i class='fas fa-ban'></i> Cliente bloqueado exitosamente.", "var(--rojo)");
            }
        };

        window.borrarCadete = async function(idCadete) { if(confirm(`¿Desconectar a ${idCadete.toUpperCase()}?`)) { await remove(ref(db, 'repartidores/' + idCadete)); } };

        window.aprobarPedido = async function(codigo) { await update(ref(db, 'bolsa_pedidos/' + codigo), { estado: "pendiente" }); mostrarToast("<i class='fas fa-check-circle'></i> ¡Aprobado! Ya está en el radar de la flota.", "var(--verde)"); };

        async function geocodificar(direccion) { const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion + ", Río Cuarto, Córdoba, Argentina")}`); const data = await res.json(); return data.length > 0 ? { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) } : null; }

        window.lanzarPedidoManual = async function() {
            const ori = document.getElementById('input-origen').value.trim(); const des = document.getElementById('input-destino').value.trim(); const det = document.getElementById('input-detalle').value.trim(); const btn = document.getElementById('btn-lanzar');
            if(!ori || !des) return alert("Falta el origen o el destino.");
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CALCULANDO...'; btn.disabled = true;

            try {
                const cOri = await geocodificar(ori); const cDes = await geocodificar(des);
                if(cOri && cDes) {
                    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${cOri.lng},${cOri.lat};${cDes.lng},${cDes.lat}?overview=false`);
                    const data = await res.json();
                    
                    if (data.routes && data.routes.length > 0) {
                        let cuadras = Math.ceil(data.routes[0].distance / 100);
                        let precio = cuadras <= 10 ? 3500 : (cuadras <= 20 ? 4000 : (cuadras <= 30 ? 4500 : 5000)); 
                        if(cuadras > 30) precio = 5000 + ((cuadras-30)*100);

                        let codigo = "LEON-" + Math.floor(1000 + Math.random() * 9000);
                        await set(ref(db, 'bolsa_pedidos/' + codigo), { codigo: codigo, origen: ori, destino: des, detalle: det || "Envío", precio: precio, estado: "pendiente", repartidor: "", latOri: cOri.lat, lngOri: cOri.lng, latDes: cDes.lat, lngDes: cDes.lng, timestamp: Date.now() });
                        document.getElementById('input-origen').value = ""; document.getElementById('input-destino').value = ""; document.getElementById('input-detalle').value = "";
                        mostrarToast("<i class='fas fa-rocket'></i> Viaje manual al radar.", "var(--dorado)");
                    }
                } else { alert("No se encontró la dirección."); }
            } catch(e) {}
            btn.innerHTML = '<i class="fas fa-rocket"></i> ENVIAR AL RADAR'; btn.disabled = false;
        };

        function escucharFlota() {
            onValue(ref(db, 'repartidores'), (snapshot) => {
                const lista = document.getElementById('lista-flota'); lista.innerHTML = "";
                
                if (!snapshot.exists()) { 
                    lista.innerHTML = '<p style="color: #666; font-size: 0.95rem;">Sin cadetes conectados.</p>'; 
                    for(let k in marcadoresMotos) { mapaGlobal.removeLayer(marcadoresMotos[k]); }
                    marcadoresMotos = {};
                    return; 
                }

                const activos = [];

                snapshot.forEach(child => {
                    const rep = child.val(); const key = child.key; const nombre = rep.nombre ? rep.nombre.toUpperCase() : key.toUpperCase();
                    activos.push(key);

                    if(rep.estado === "inactivo") {
                        lista.innerHTML += `<div class="flota-pill flota-libre"><i class="fas fa-motorcycle"></i> ${nombre} (Libre) <i class="fas fa-times-circle btn-borrar-cadete" onclick="borrarCadete('${key}')"></i></div>`;
                    } else {
                        lista.innerHTML += `<div class="flota-pill flota-viaje"><i class="fas fa-route"></i> ${nombre} (En Viaje) <i class="fas fa-times-circle btn-borrar-cadete" onclick="borrarCadete('${key}')"></i></div>`;
                    }

                    if (rep.latitud && rep.longitud && mapaGlobal) {
                        const latLng = L.latLng(rep.latitud, rep.longitud);
                        const iconoActual = (rep.estado === "inactivo") ? iconoMotoLibre : iconoMotoViaje;
                        
                        if(!marcadoresMotos[key]) {
                            marcadoresMotos[key] = L.marker(latLng, {icon: iconoActual}).addTo(mapaGlobal)
                                .bindTooltip(nombre, {permanent: true, direction: "bottom", className: "etiqueta-moto"});
                        } else {
                            marcadoresMotos[key].setLatLng(latLng);
                            marcadoresMotos[key].setIcon(iconoActual);
                        }
                    }
                });

                for(let k in marcadoresMotos) {
                    if(!activos.includes(k)) {
                        mapaGlobal.removeLayer(marcadoresMotos[k]);
                        delete marcadoresMotos[k];
                    }
                }
            });
        }

        function escucharPedidos() {
            onValue(ref(db, 'bolsa_pedidos'), (snapshot) => {
                const lista = document.getElementById('lista-pedidos'); lista.innerHTML = "";
                if (!snapshot.exists()) {
                    viajesFinalizados = [];
                    renderizarHistorialCadetes();
                    return lista.innerHTML = "<p style='color: #888; text-align: center;'>Radar despejado.</p>";
                }

                const pedidosArray = []; snapshot.forEach(child => { pedidosArray.push(child.val()); }); pedidosArray.sort((a,b) => b.timestamp - a.timestamp);
                viajesFinalizados = pedidosArray.filter(pedido => pedido.estado === 'entregado');
                renderizarHistorialCadetes();

                pedidosArray.forEach(ped => {
                    if(ped.estado === "entregado") {
                        if(!historialEntregados.includes(ped.codigo)) { historialEntregados.push(ped.codigo); mostrarToast(`✅ ${ped.repartidor.toUpperCase()} finalizó su viaje.`, "var(--verde)"); } return; 
                    }

                    let textoDesde = ped.origen || "";
                    let textoHasta = ped.destino || "";

                    if (!textoDesde && ped.direccion) {
                        if (ped.direccion.includes(" hasta ")) {
                            let partes = ped.direccion.split(" hasta ");
                            textoDesde = partes[0];
                            textoHasta = partes[1];
                        } else {
                            textoDesde = "Punto de Retiro";
                            textoHasta = ped.direccion;
                        }
                    }

                    let datosClienteHTML = "";
                    if (ped.nombreCliente && ped.dniCliente) {
                        datosClienteHTML = `
                            <div class="info-cliente">
                                <div><i class="fas fa-user"></i> ${ped.nombreCliente} | <strong>DNI:</strong> ${ped.dniCliente}</div>
                                <button class="btn-bloquear-cliente" onclick="bloquearCliente('${ped.codigo}', '${ped.dniCliente}', '${ped.ipCliente}')" title="Bloquear DNI e IP"><i class="fas fa-ban"></i></button>
                            </div>
                        `;
                    }

                    if(ped.estado === "solicitado") {
                        lista.innerHTML += `
                        <div class="pedido-item solicitado">
                            <div class="pedido-header"><span><i class="fas fa-globe"></i> ${ped.codigo}</span>
                                <div style="display:flex; gap:10px; align-items:center;">
                                    <button class="btn-aprobar" onclick="aprobarPedido('${ped.codigo}')"><i class="fas fa-check"></i> APROBAR</button>
                                    <button class="btn-borrar-viaje" onclick="borrarPedido('${ped.codigo}')"><i class="fas fa-times-circle"></i></button>
                                </div>
                            </div>
                            ${datosClienteHTML}
                            <div class="pedido-zona">
                                <strong><i class="fas fa-map-marker-alt" style="color: var(--rojo);"></i> Desde:</strong> ${textoDesde}<br>
                                <strong><i class="fas fa-flag-checkered" style="color: var(--azul);"></i> Hasta:</strong> ${textoHasta}<br>
                                <strong><i class="fas fa-box"></i> Lleva:</strong> ${ped.detalle || 'Envío'}<br>
                                <strong><i class="fas fa-money-bill-wave" style="color: var(--verde);"></i> Cobra:</strong> $${ped.precio}
                            </div>
                        </div>`;
                    } 
                    else if(ped.estado === "pendiente") {
                        lista.innerHTML += `
                        <div class="pedido-item">
                            <div class="pedido-header"><span><i class="fas fa-box"></i> ${ped.codigo}</span>
                                <div style="display:flex; gap:10px;"><span class="estado-badge badge-esperando"><i class="fas fa-spinner fa-spin"></i> Buscando cadete...</span><button class="btn-borrar-viaje" onclick="borrarPedido('${ped.codigo}')"><i class="fas fa-times-circle"></i></button></div>
                            </div>
                            ${datosClienteHTML}
                            <div class="pedido-zona"><strong>Desde:</strong> ${textoDesde} <br> <strong>Hasta:</strong> ${textoHasta}</div>
                        </div>`;
                    } 
                    else if (ped.estado === "asignado" || ped.estado === "yendo_al_local" || ped.estado === "en_camino") {
                        lista.innerHTML += `
                        <div class="pedido-item asignado">
                            <div class="pedido-header">
                                <span><i class="fas fa-box"></i> ${ped.codigo}</span>
                                <div style="display:flex; gap:10px;">
                                    <span class="estado-badge badge-aceptado"><i class="fas fa-check-circle"></i> ${ped.repartidor.toUpperCase()}</span>
                                    <button class="btn-borrar-viaje" onclick="borrarPedido('${ped.codigo}', '${ped.repartidor}')" title="Cancelar Viaje en Curso"><i class="fas fa-times-circle"></i></button>
                                </div>
                            </div>
                            ${datosClienteHTML}
                            <div class="pedido-zona"><strong>Desde:</strong> ${textoDesde} <br> <strong>En viaje hacia:</strong> ${textoHasta}</div>
                        </div>`;
                    }
                });
            });
        }
    </script>
</body>
</html>
